<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fest Live Broadcast Dashboard</title>
    <!-- Bootstrap 5 CSS & FontAwesome Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-page: #f1f5f9;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --gold: #f59e0b;
            --silver: #94a3b8;
            --bronze: #b45309;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        #screen-keeper-video {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
            z-index: -1;
        }

        .tv-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
            height: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .tv-card-header {
            background: #f8fafc;
            border-bottom: 1px solid var(--border-color);
            padding: clamp(4px, 0.9vh, 8px) 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .top-navbar {
            height: 52px;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            flex-shrink: 0;
        }

        .school-brand-badge {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 3px 12px 3px 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }

        .school-icon-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #2563eb;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 rgba(239, 68, 68, 0.4);
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* Top-Left: Zero-scroll House Standings */
        #house-rankings-container {
            padding: clamp(4px, 1vh, 10px) 14px;
            overflow: hidden !important;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            height: 100%;
        }

        .house-row-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            margin-bottom: 0;
        }

        .house-row-meta {
            font-size: clamp(0.68rem, 1.2vh, 0.84rem);
            margin-bottom: 2px;
        }

        .house-bar-bg {
            background: #e2e8f0;
            border-radius: 6px;
            height: clamp(14px, 2.2vh, 22px);
            width: 100%;
            overflow: hidden;
            display: flex;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.12);
            border: 1px solid #cbd5e1;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .house-bar-solo {
            height: 100%;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: clamp(0.55rem, 1vh, 0.72rem);
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }

        .house-bar-group {
            height: 100%;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            background-image: repeating-linear-gradient(
                45deg,
                rgba(0, 0, 0, 0.22),
                rgba(0, 0, 0, 0.22) 8px,
                rgba(255, 255, 255, 0.15) 8px,
                rgba(255, 255, 255, 0.15) 16px
            );
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: clamp(0.55rem, 1vh, 0.72rem);
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0,0,0,0.7);
            border-left: 2px solid #ffffff;
        }

        .house-bar-highlight {
            animation: barGlow 1.2s ease-out;
        }

        @keyframes barGlow {
            0% { filter: brightness(1); }
            50% { filter: brightness(1.6) drop-shadow(0 0 10px rgba(245, 158, 11, 0.9)); transform: scaleY(1.15); }
            100% { filter: brightness(1); transform: scaleY(1); }
        }

        /* Top-Right: Event Winner Carousel */
        .winner-card {
            border-radius: 8px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
        }
        .podium-1 { border-left: 5px solid var(--gold); }
        .podium-2 { border-left: 5px solid var(--silver); }
        .podium-3 { border-left: 5px solid var(--bronze); }

        .breaking-banner {
            background: linear-gradient(90deg, #ef4444, #f97316);
            color: white;
            font-weight: 800;
            letter-spacing: 0.5px;
            animation: pulse-banner 1.2s infinite;
        }

        @keyframes pulse-banner {
            0% { opacity: 0.9; }
            50% { opacity: 1; filter: brightness(1.1); }
            100% { opacity: 0.9; }
        }

        /* Bottom Half: Continuous Horizontal Marquee Scroller */
        .matrix-table-container {
            flex: 1;
            overflow-x: hidden;
            overflow-y: hidden;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            position: relative;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .matrix-table-container::-webkit-scrollbar {
            display: none;
        }

        .table-light-custom {
            --bs-table-bg: #ffffff;
            --bs-table-border-color: #cbd5e1;
            color: var(--text-main);
            margin-bottom: 0;
            border-collapse: separate;
            border-spacing: 0;
            width: auto;
            min-width: 100%;
            height: 100%;
        }

        .table-light-custom th, 
        .table-light-custom td {
            border-bottom: 1px solid #cbd5e1 !important;
            border-right: 1px solid #e2e8f0;
            padding: 3px 2px;
        }

        .table-light-custom tbody tr:nth-child(odd) {
            background-color: #ffffff;
        }
        .table-light-custom tbody tr:nth-child(even) {
            background-color: #f8fafc;
        }

        .house-fixed-col {
            position: sticky;
            left: 0;
            z-index: 5;
            width: 175px;
            min-width: 175px;
            max-width: 175px;
            border-right: 3px solid #94a3b8 !important;
            box-shadow: 3px 0 6px rgba(0, 0, 0, 0.06);
            background-color: #ffffff !important;
        }
        .table-light-custom tbody tr:nth-child(even) .house-fixed-col {
            background-color: #f8fafc !important;
        }

        .house-row-accent {
            transition: background-color 0.2s ease;
        }
        .house-row-accent:hover {
            background-color: #eff6ff !important;
        }

        .event-header-cell {
            vertical-align: bottom;
            text-align: center;
            background: #f8fafc;
            padding: 6px 2px 4px 2px;
            height: 135px;
            width: 58px;
            min-width: 58px;
            max-width: 64px;
        }

        .event-data-cell {
            width: 58px;
            min-width: 58px;
            max-width: 64px;
            text-align: center;
            vertical-align: middle;
            padding: 2px !important;
            white-space: nowrap;
        }

        .event-badge-flex-row {
            display: inline-flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 2px;
            width: 100%;
            overflow: visible;
        }

        .event-vertical-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100%;
            width: 100%;
        }

        .event-vertical-title {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            white-space: normal;
            word-break: break-word;
            line-height: 1.05;
            max-height: 94px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            font-size: clamp(0.66rem, 1.1vh, 0.74rem);
            font-weight: 700;
            letter-spacing: 0.2px;
            color: #1e293b;
            margin: auto 0;
        }

        .pos-badge {
            font-size: clamp(0.58rem, 0.95vh, 0.68rem);
            padding: 2px 3px;
            border-radius: 4px;
            display: inline-block;
            font-weight: 700;
            line-height: 1;
            white-space: nowrap;
        }

        .fade-swap {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Interactive Breaking Result Overlay */
        #breaking-result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #breaking-result-overlay.active {
            display: flex;
            opacity: 1;
            animation: zoomInPopup 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        #breaking-result-overlay.closing {
            animation: flyToLeaderboard 0.6s cubic-bezier(0.7, 0, 0.84, 0) forwards;
        }

        @keyframes zoomInPopup {
            from {
                opacity: 0;
                transform: scale(0.85) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes flyToLeaderboard {
            0% {
                opacity: 1;
                transform: scale(1) translate(0, 0);
            }
            100% {
                opacity: 0;
                transform: scale(0.2) translate(-55vw, -40vh);
            }
        }

        .breaking-modal-box {
            background: #ffffff;
            border-radius: 16px;
            border: 2px solid #cbd5e1;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
            width: 90%;
            max-width: 760px;
            padding: 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .breaking-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(90deg, #ef4444, #f97316);
            color: #ffffff;
            font-weight: 800;
            font-size: 0.85rem;
            padding: 4px 14px;
            border-radius: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
            animation: pulse-banner 1.2s infinite;
        }
    </style>
</head>
<body>

    <!-- Background Stay-Awake Video -->
    <video id="screen-keeper-video" autoplay muted loop playsinline src="data:video/mp4;base64,AAAAHGZ0eXBtcDQyAAAAAG1wNDJpc29tYXZjMQAAAAhmcmVlAAAAL21kYXQAAAAAAAABGAEA4AAAABhhdWNmYXN0AAAAAAABAAAAAAABAAAAAA=="></video>

    <!-- Interactive Broadcast Popup Overlay -->
    <div id="breaking-result-overlay">
        <div class="breaking-modal-box" id="breaking-modal-content">
            <!-- Dynamically populated -->
        </div>
    </div>

    <!-- Global Broadcast Bar -->
    <header class="top-navbar">
        <div class="d-flex align-items-center gap-3">
            <div class="school-brand-badge" id="wake-status-badge" title="Screen Stay-Awake active">
                <div class="school-icon-circle">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <div class="d-flex flex-column" style="line-height: 1.1;">
                    <div class="d-flex align-items-center gap-1">
                        <span class="pulse-dot"></span>
                        <span class="fw-bold" style="font-size: 0.78rem; letter-spacing: 0.5px;">LIVE BROADCAST</span>
                    </div>
                    <small class="text-muted" style="font-size: 0.65rem;" id="school-title-text">KYHSS ATHAVANAD</small>
                </div>
            </div>

            <span class="fw-bold fs-6 tracking-wide text-dark" id="broadcast-fest-name">ANNUAL FEST LIVE</span>
        </div>
        
        <div class="d-flex align-items-center gap-2">
            <label for="global-year-select" class="small text-secondary fw-semibold mb-0">
                <i class="fas fa-calendar-days text-primary me-1"></i>Academic Year:
            </label>
            <select id="global-year-select" class="form-select form-select-sm bg-white text-dark border-secondary shadow-sm" style="width: 140px;">
                <option value="">Loading...</option>
            </select>
        </div>
    </header>

    <!-- Main TV Viewport -->
    <main class="container-fluid p-2 flex-grow-1 d-flex flex-column gap-2" style="height: calc(100vh - 52px);">
        
        <!-- Top Half: Leaderboard & Winner Spotlight (~38%) -->
        <div class="row g-2" style="height: 38%;">
            
            <!-- Top Left: Standings -->
            <div class="col-6 h-100">
                <div class="tv-card">
                    <div class="tv-card-header">
                        <div class="d-flex align-items-center gap-2">
                            <span class="fw-bold small text-dark"><i class="fas fa-trophy text-warning me-2"></i>HOUSE STANDINGS</span>
                            <small class="text-muted" style="font-size: 0.7rem;">(Solid: Solo | Striped: Group)</small>
                        </div>
                        <span class="badge bg-primary" id="total-results-count">0 Events Evaluated</span>
                    </div>
                    <div id="house-rankings-container">
                        <div class="d-flex h-100 align-items-center justify-content-center text-muted small">
                            <i class="fas fa-spinner fa-spin me-2"></i>Loading Scores...
                        </div>
                    </div>
                </div>
            </div>

            <!-- Top Right: Winner Spotlight & Breaking News (5s) -->
            <div class="col-6 h-100">
                <div class="tv-card">
                    <div class="tv-card-header" id="spotlight-header">
                        <span class="fw-bold small text-dark" id="spotlight-title"><i class="fas fa-medal text-primary me-2"></i>WINNER SPOTLIGHT (5s)</span>
                        <span class="badge bg-light text-dark border font-monospace" id="spotlight-counter">0 / 0</span>
                    </div>
                    <div class="p-3 flex-grow-1 d-flex flex-column justify-content-center" id="winner-spotlight-container">
                        <div class="text-center text-muted small">
                            <i class="fas fa-spinner fa-spin me-2"></i>Waiting for results...
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Bottom Half: Continuous Autoscrolling Matrix (~62%) -->
        <div class="row g-2 flex-grow-1" style="height: 62%;">
            <div class="col-12 h-100">
                <div class="tv-card">
                    <div class="tv-card-header py-1">
                        <div class="d-flex align-items-center gap-2">
                            <span class="fw-bold small text-dark"><i class="fas fa-layer-group text-success me-2"></i>PLACEMENTS MATRIX</span>
                            <span class="badge bg-primary" id="current-category-pill">ALL CATEGORIES</span>
                            <span class="badge bg-secondary font-monospace" id="scroll-status-badge">Auto-Scroll Active</span>
                        </div>
                        <div class="small text-secondary" style="font-size: 0.75rem;">
                            Category change in <span id="category-timer" class="fw-bold text-dark">20</span>s
                        </div>
                    </div>

                    <div class="matrix-table-container" id="matrix-container">
                        <table class="table table-light-custom align-middle text-center table-bordered" id="matrix-table">
                            <thead>
                                <tr id="matrix-header-row">
                                    <th class="house-fixed-col text-start ps-3 align-middle">HOUSE \ EVENTS</th>
                                </tr>
                            </thead>
                            <tbody id="matrix-body-rows">
                                <!-- Populated dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script type="module">
        import { db, systemContext } from "./firebase-config.js";
        import { 
            collection, 
            onSnapshot, 
            doc, 
            getDocs 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let wakeLockSentinel = null;

        async function activateScreenKeeper() {
            const videoEl = document.getElementById('screen-keeper-video');
            if (videoEl) {
                videoEl.play().catch(e => console.log('[SCREEN-KEEPER] Autoplay waiting for click:', e));
            }

            if ('wakeLock' in navigator) {
                try {
                    wakeLockSentinel = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.warn('[SCREEN-KEEPER] Native WakeLock error:', err);
                }
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') activateScreenKeeper();
        });
        window.addEventListener('click', () => activateScreenKeeper(), { once: true });

        // State & Configuration
        const urlParams = new URLSearchParams(window.location.search);
        let activeYearId = urlParams.get('year') || systemContext?.activeYearId || localStorage.getItem('activeYearId') || '2026-27';
        const targetFestId = urlParams.get('fest') || '';

        let students = [];
        let houses = [];
        let events = [];
        let registrations = [];
        let groups = [];
        let results = [];
        let houseScoreMap = new Map();

        let spotlightIndex = 0;
        let categoryIndex = 0;
        let availableCategories = [];
        let categoryTimerSeconds = 20;
        let priorityQueue = [];
        let activeUnsubscribers = [];

        // Interactive Popup Queue
        let popupQueue = [];
        let isShowingPopup = false;

        // Auto-Scroll Settings
        let scrollRafId = null;
        let scrollSpeed = 0.65;
        let isScrollPaused = false;

        function pointsFor(position, isGroup = false, name = '') {
            const isMarchPast = String(name || '').trim().toUpperCase() === "MARCH PAST";
            const table = {
                marchPast: { 1: 20, 2: 15, 3: 10, 4: 5 },
                group:     { 1: 15, 2: 10, 3: 5,  4: 0 },
                solo:      { 1: 5,  2: 3,  3: 1,  4: 0 }
            };
            const tier = isMarchPast ? 'marchPast' : (isGroup ? 'group' : 'solo');
            return table[tier][position] ?? 0;
        }

        // Calculate points ONLY for events that have result entries published
        function calculateEvaluatedPossiblePoints() {
            const completedEventIds = new Set(
                results.filter(r => (r.results || []).length > 0).map(r => r.eventId)
            );

            if (completedEventIds.size === 0) return 1;

            let totalPossible = 0;
            completedEventIds.forEach(evId => {
                const ev = events.find(e => e.id === evId);
                const isMarchPast = String(ev?.name || '').trim().toUpperCase() === "MARCH PAST";
                const isGroup = Boolean(ev?.isGroupEvent || ev?.type === 'group');

                if (isMarchPast) {
                    totalPossible += (20 + 15 + 10 + 5);
                } else if (isGroup) {
                    totalPossible += (15 + 10 + 5);
                } else {
                    totalPossible += (5 + 3 + 1);
                }
            });

            return Math.max(totalPossible, 1);
        }

        const CATEGORY_ICONS = {
            'KIDS': 'fa-child text-warning',
            'SUB-JUNIOR': 'fa-user-graduate text-info',
            'JUNIOR': 'fa-running text-primary',
            'SENIOR': 'fa-award text-danger',
            'GENERAL': 'fa-shapes text-secondary',
            'DEFAULT': 'fa-star text-secondary'
        };

        function getCategoryIcon(cat) {
            const clean = (cat || '').toUpperCase();
            return CATEGORY_ICONS[clean] || CATEGORY_ICONS['DEFAULT'];
        }

        async function setupYearSelector() {
            const selectEl = document.getElementById('global-year-select');
            if (!selectEl) return;

            try {
                const yearSnap = await getDocs(collection(db, 'academicYears'));
                const yearList = yearSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                if (yearList.length) {
                    selectEl.innerHTML = yearList.map(y => 
                        `<option value="${y.id}" ${y.id === activeYearId ? 'selected' : ''}>${y.label || y.id}</option>`
                    ).join('');
                } else {
                    selectEl.innerHTML = `<option value="${activeYearId}">${activeYearId}</option>`;
                }

                selectEl.addEventListener('change', (e) => {
                    if (e.target.value) {
                        activeYearId = e.target.value;
                        localStorage.setItem('activeYearId', activeYearId);
                        const newUrl = new URL(window.location.href);
                        newUrl.searchParams.set('year', activeYearId);
                        window.history.replaceState({}, '', newUrl);
                        bindRealtimeListeners();
                    }
                });
            } catch (err) {
                console.warn("[BROADCAST] Could not fetch academic years list:", err);
                selectEl.innerHTML = `<option value="${activeYearId}">${activeYearId}</option>`;
            }
        }

        function bindRealtimeListeners() {
            activeUnsubscribers.forEach(unsub => unsub());
            activeUnsubscribers = [];

            const yearPath = `academicYears/${activeYearId}`;

            activeUnsubscribers.push(onSnapshot(collection(db, `${yearPath}/students`), snap => {
                students = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                recomputeAll();
            }));

            activeUnsubscribers.push(onSnapshot(collection(db, `${yearPath}/festHouses`), snap => {
                houses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                recomputeAll();
            }));

            activeUnsubscribers.push(onSnapshot(collection(db, `${yearPath}/festEvents`), snap => {
                events = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                    .filter(e => !targetFestId || e.festId === targetFestId);
                
                availableCategories = [...new Set(events.map(e => e.category).filter(Boolean))];
                if (!availableCategories.includes('ALL')) availableCategories.unshift('ALL');
                recomputeAll();
            }));

            activeUnsubscribers.push(onSnapshot(collection(db, `${yearPath}/festRegistrations`), snap => {
                registrations = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                    .filter(r => !r.isDeleted && (!targetFestId || r.festId === targetFestId));
                recomputeAll();
            }));

            activeUnsubscribers.push(onSnapshot(collection(db, `${yearPath}/festGroups`), snap => {
                groups = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                    .filter(g => !g.isDeleted);
                recomputeAll();
            }));

            let isFirstLoad = true;
            activeUnsubscribers.push(onSnapshot(collection(db, `${yearPath}/festResults`), snap => {
                const incoming = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                    .filter(r => !targetFestId || r.festId === targetFestId);

                if (!isFirstLoad) {
                    snap.docChanges().forEach(change => {
                        if (change.type === 'added' || change.type === 'modified') {
                            const changedResult = { id: change.doc.id, ...change.doc.data() };
                            
                            // Check for confirmation flag
                            const isConfirmed = changedResult.isConfirmed === true || 
                                                String(changedResult.status || '').toLowerCase() === 'confirmed';

                            if (isConfirmed && (changedResult.results || []).length > 0) {
                                queueConfirmedResult(changedResult);
                            } else {
                                priorityQueue.unshift(changedResult);
                                cycleSpotlight();
                            }
                        }
                    });
                }

                results = incoming;
                isFirstLoad = false;
                if (!isShowingPopup) {
                    recomputeAll();
                }
            }));
        }

        function resolveStandingHouseId(st, eventId) {
            if (st.houseId) return st.houseId;

            if (st.groupId) {
                const grp = groups.find(g => g.id === st.groupId);
                if (grp?.houseId) return grp.houseId;
                if (grp?.members?.length) {
                    const firstStudentId = grp.members[0].studentId;
                    const stu = students.find(s => s.id === firstStudentId);
                    if (stu?.houseId) return stu.houseId;
                    const reg = registrations.find(r => r.studentId === firstStudentId);
                    if (reg?.houseId) return reg.houseId;
                }
            }

            if (st.studentId) {
                const regEvent = registrations.find(r => r.studentId === st.studentId && (r.events || []).includes(eventId));
                if (regEvent?.houseId) return regEvent.houseId;
                const regAny = registrations.find(r => r.studentId === st.studentId);
                if (regAny?.houseId) return regAny.houseId;
                const stu = students.find(s => s.id === st.studentId);
                if (stu?.houseId) return stu.houseId;
            }

            return null;
        }

        function recomputeAll() {
            calculateHouseScores();
            renderHouseLeaderboard();
            renderCategoryMatrix();
            const evaluatedCount = results.filter(r => (r.results || []).length > 0).length;
            const el = document.getElementById('total-results-count');
            if (el) el.textContent = `${evaluatedCount} Events Evaluated`;
        }

        function calculateHouseScores() {
            houseScoreMap.clear();
            houses.forEach(h => houseScoreMap.set(h.id, { solo: 0, group: 0, total: 0 }));

            results.forEach(res => {
                const ev = events.find(e => e.id === res.eventId);
                const isGroup = Boolean(ev?.isGroupEvent || ev?.type === 'group');
                const evName = ev?.name || '';

                (res.results || []).forEach(st => {
                    const pos = Number(st.position);
                    let pts = (pos >= 1 && pos <= 4) ? pointsFor(pos, isGroup, evName) : (Number(st.points) || 0);
                    const targetHouseId = resolveStandingHouseId(st, res.eventId);

                    if (targetHouseId && houseScoreMap.has(targetHouseId)) {
                        const entry = houseScoreMap.get(targetHouseId);
                        if (isGroup || String(evName).trim().toUpperCase() === "MARCH PAST") {
                            entry.group += pts;
                        } else {
                            entry.solo += pts;
                        }
                        entry.total += pts;
                    }
                });
            });
        }

        function renderHouseLeaderboard() {
            const container = document.getElementById('house-rankings-container');
            if (!container || !houses.length) return;

            const sorted = [...houses].map(h => ({
                ...h,
                scores: houseScoreMap.get(h.id) || { solo: 0, group: 0, total: 0 }
            })).sort((a, b) => b.scores.total - a.scores.total);

            const evaluatedPossiblePoints = calculateEvaluatedPossiblePoints();

            container.innerHTML = sorted.map((h, index) => {
                const soloPct = Math.min(((h.scores.solo / evaluatedPossiblePoints) * 100), 100).toFixed(1);
                const groupPct = Math.min(((h.scores.group / evaluatedPossiblePoints) * 100), 100).toFixed(1);

                const badgeClass = index === 0 ? 'bg-warning text-dark' : (index === 1 ? 'bg-secondary text-white' : 'bg-light text-dark border');
                const rankText = index === 0 ? '<i class="fas fa-crown text-warning me-1"></i>1st' : `${index + 1}`;
                const houseColor = h.color || '#2563eb';

                return `
                    <div class="house-row-wrapper">
                        <div class="d-flex justify-content-between align-items-center house-row-meta">
                            <div class="d-flex align-items-center gap-1 gap-md-2">
                                <span class="badge ${badgeClass}" style="min-width: 36px; padding: 2px 4px;">${rankText}</span>
                                <span class="fw-bold text-dark text-truncate">${h.name}</span>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <small class="text-muted d-none d-md-inline" style="font-size: 0.65rem;">
                                    (Solo: <strong>${h.scores.solo}</strong> | Grp: <strong>${h.scores.group}</strong>)
                                </small>
                                <span class="fw-bold font-monospace text-dark">
                                    ${h.scores.total} 
                                    <small class="text-secondary" style="font-size: 0.65rem;">/ ${evaluatedPossiblePoints} PTS</small>
                                </span>
                            </div>
                        </div>

                        <div class="house-bar-bg" title="Evaluated points: ${evaluatedPossiblePoints}">
                            <div class="house-bar-solo" style="width: ${soloPct}%; background-color: ${houseColor};" title="Solo Points: ${h.scores.solo} (${soloPct}%)">
                                ${Number(soloPct) > 6 ? h.scores.solo : ''}
                            </div>
                            <div class="house-bar-group" style="width: ${groupPct}%; background-color: ${houseColor};" title="Group Points: ${h.scores.group} (${groupPct}%)">
                                ${Number(groupPct) > 6 ? h.scores.group : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Interactive Popup Logic
        function queueConfirmedResult(resultData) {
            popupQueue.push(resultData);
            if (!isShowingPopup) {
                showNextPopup();
            }
        }

        function showNextPopup() {
            if (popupQueue.length === 0) {
                isShowingPopup = false;
                return;
            }

            isShowingPopup = true;
            isScrollPaused = true;

            const resultItem = popupQueue.shift();
            const event = events.find(e => e.id === resultItem.eventId);
            const eventName = event?.name || resultItem.eventId || 'Event Results';
            const category = event?.category || 'General';
            const isGroup = Boolean(event?.isGroupEvent || event?.type === 'group');

            const overlay = document.getElementById('breaking-result-overlay');
            const modalContent = document.getElementById('breaking-modal-content');
            if (!overlay || !modalContent) return;

            const standings = (resultItem.results || []).sort((a, b) => a.position - b.position);

            modalContent.innerHTML = `
                <div class="mb-2">
                    <span class="breaking-tag"><i class="fas fa-bolt"></i> RESULT CONFIRMED</span>
                </div>
                <h3 class="fw-bold text-dark mb-1">${eventName}</h3>
                <p class="text-secondary small mb-3">
                    <i class="fas ${getCategoryIcon(category)} me-1"></i>${category} &bull; ${isGroup ? 'Group Event' : 'Solo Event'}
                </p>

                <div class="row g-2 justify-content-center">
                    ${[1, 2, 3].map(pos => {
                        const item = standings.find(s => s.position === pos);
                        let name = 'Not placed';
                        let houseName = '---';
                        let houseColor = '#64748b';
                        let pts = 0;

                        if (item) {
                            const resolvedHId = resolveStandingHouseId(item, resultItem.eventId);
                            const h = houses.find(x => x.id === resolvedHId);
                            houseName = h?.name || 'N/A';
                            houseColor = h?.color || houseColor;
                            pts = item.points || pointsFor(pos, isGroup, eventName);

                            if (item.groupId) {
                                const grp = groups.find(g => g.id === item.groupId);
                                name = grp?.name || 'Group';
                            } else {
                                const stu = students.find(s => s.id === item.studentId);
                                const reg = registrations.find(r => r.studentId === item.studentId);
                                name = stu?.name || reg?.studentName || 'Student';
                            }
                        }

                        const podiumClass = pos === 1 ? 'podium-1' : (pos === 2 ? 'podium-2' : 'podium-3');
                        const badgeColor = pos === 1 ? 'bg-warning text-dark' : (pos === 2 ? 'bg-secondary text-white' : 'bg-light text-dark border');
                        const rankText = pos === 1 ? '1ST PLACE' : (pos === 2 ? '2ND PLACE' : '3RD PLACE');

                        return `
                            <div class="col-4">
                                <div class="winner-card ${podiumClass} p-3 shadow-sm h-100 bg-light">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <span class="badge ${badgeColor}" style="font-size: 0.7rem;">${rankText}</span>
                                        <span class="fw-bold font-monospace text-success">+${pts} PTS</span>
                                    </div>
                                    <h5 class="fw-bold text-dark text-truncate mt-2 mb-1" style="font-size: 1rem;">${name}</h5>
                                    <div class="fw-bold" style="color: ${houseColor}; font-size: 0.85rem;">
                                        <i class="fas fa-shield-halved me-1"></i>${houseName}
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;

            overlay.className = 'active';

            setTimeout(() => {
                overlay.className = 'active closing';

                setTimeout(() => {
                    overlay.className = '';
                    overlay.style.display = 'none';

                    recomputeAll();
                    triggerHouseBarsGlow();
                    isScrollPaused = false;

                    setTimeout(() => {
                        showNextPopup();
                    }, 600);
                }, 550);
            }, 4500);
        }

        function triggerHouseBarsGlow() {
            const bars = document.querySelectorAll('.house-bar-bg');
            bars.forEach(bar => {
                bar.classList.remove('house-bar-highlight');
                void bar.offsetWidth;
                bar.classList.add('house-bar-highlight');
            });
        }

        function cycleSpotlight() {
            const container = document.getElementById('winner-spotlight-container');
            const titleEl = document.getElementById('spotlight-title');
            const counterEl = document.getElementById('spotlight-counter');
            if (!container) return;

            let activeResult = null;
            let isBreaking = false;

            if (priorityQueue.length > 0) {
                activeResult = priorityQueue.shift();
                isBreaking = true;
            } else if (results.length > 0) {
                activeResult = results[spotlightIndex % results.length];
                spotlightIndex++;
            }

            if (!activeResult) {
                container.innerHTML = `<div class="text-center text-muted small">Awaiting published results...</div>`;
                return;
            }

            const event = events.find(e => e.id === activeResult.eventId);
            const total = results.length;
            const currentNum = (spotlightIndex % total) || total;

            if (isBreaking) {
                titleEl.innerHTML = `<span class="badge breaking-banner px-2 py-1"><i class="fas fa-bolt me-1"></i>NEW RESULT SUBMITTED</span>`;
            } else {
                titleEl.innerHTML = `<i class="fas fa-medal text-primary me-2"></i>WINNER SPOTLIGHT`;
                counterEl.textContent = `${currentNum} / ${total}`;
            }

            const standings = (activeResult.results || []).sort((a, b) => a.position - b.position);

            container.innerHTML = `
                <div class="fade-swap">
                    <div class="d-flex justify-content-between align-items-center border-bottom pb-1 mb-2">
                        <div>
                            <div class="fw-bold text-dark small text-truncate" style="max-width: 250px;">${event?.name || activeResult.eventId}</div>
                            <div class="text-secondary" style="font-size: 0.72rem;">
                                <i class="fas ${getCategoryIcon(event?.category)} me-1"></i>${event?.category || 'General'} 
                                &bull; ${event?.isGroupEvent ? 'Group' : 'Solo'}
                            </div>
                        </div>
                        <span class="badge bg-success font-monospace" style="font-size: 0.7rem;"><i class="fas fa-check-circle me-1"></i>Final</span>
                    </div>

                    <div class="row g-2">
                        ${[1, 2, 3].map(pos => {
                            const item = standings.find(s => s.position === pos);
                            let targetName = 'Not placed';
                            let houseName = '---';
                            let houseColor = '#64748b';

                            if (item) {
                                if (item.groupId) {
                                    const grp = groups.find(g => g.id === item.groupId);
                                    targetName = grp?.name || 'Group';
                                    const resolvedHId = resolveStandingHouseId(item, activeResult.eventId);
                                    const h = houses.find(x => x.id === resolvedHId);
                                    houseName = h?.name || 'N/A';
                                    houseColor = h?.color || houseColor;
                                } else {
                                    const stu = students.find(s => s.id === item.studentId);
                                    const reg = registrations.find(r => r.studentId === item.studentId);
                                    targetName = stu?.name || reg?.studentName || 'Student';
                                    const resolvedHId = resolveStandingHouseId(item, activeResult.eventId);
                                    const h = houses.find(x => x.id === resolvedHId);
                                    houseName = h?.name || 'N/A';
                                    houseColor = h?.color || houseColor;
                                }
                            }

                            const podiumClass = pos === 1 ? 'podium-1' : (pos === 2 ? 'podium-2' : 'podium-3');
                            const rankLabel = pos === 1 ? '1ST' : (pos === 2 ? '2ND' : '3RD');
                            const badgeColor = pos === 1 ? 'bg-warning text-dark' : (pos === 2 ? 'bg-secondary text-white' : 'bg-light text-dark border');

                            return `
                                <div class="col-4">
                                    <div class="winner-card ${podiumClass} p-2 h-100 shadow-sm">
                                        <div class="d-flex justify-content-between mb-1">
                                            <span class="badge ${badgeColor}" style="font-size: 0.65rem;">${rankLabel}</span>
                                            <span class="small font-monospace text-success fw-bold" style="font-size: 0.7rem;">${item ? `+${item.points}` : ''}</span>
                                        </div>
                                        <div class="fw-bold text-truncate text-dark" style="font-size: 0.82rem;">${targetName}</div>
                                        <div class="text-truncate" style="color: ${houseColor}; font-size: 0.72rem; font-weight: 700;">
                                            <i class="fas fa-shield-halved me-1"></i>${houseName}
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function startContinuousScroll() {
            if (scrollRafId) cancelAnimationFrame(scrollRafId);
            const container = document.getElementById('matrix-container');
            const badge = document.getElementById('scroll-status-badge');
            if (!container) return;

            let pauseUntil = 0;

            function step(timestamp) {
                if (!isScrollPaused && container.scrollWidth > container.clientWidth) {
                    if (badge) badge.style.display = 'inline-block';

                    if (timestamp >= pauseUntil) {
                        container.scrollLeft += scrollSpeed;

                        if (container.scrollLeft >= (container.scrollWidth - container.clientWidth - 1)) {
                            pauseUntil = timestamp + 1800;
                            setTimeout(() => {
                                if (container) container.scrollLeft = 0;
                            }, 1800);
                        }
                    }
                } else if (badge) {
                    badge.style.display = 'none';
                }
                scrollRafId = requestAnimationFrame(step);
            }

            scrollRafId = requestAnimationFrame(step);
        }

        function renderCategoryMatrix() {
            const container = document.getElementById('matrix-container');
            const tableHead = document.getElementById('matrix-header-row');
            const tableBody = document.getElementById('matrix-body-rows');
            const pill = document.getElementById('current-category-pill');
            if (!tableHead || !tableBody || !houses.length) return;

            const activeCat = availableCategories[categoryIndex % availableCategories.length] || 'ALL';
            pill.textContent = activeCat === 'ALL' ? 'ALL CATEGORIES' : activeCat;

            const filteredEvents = events.filter(e => activeCat === 'ALL' || e.category === activeCat);

            if (!filteredEvents.length) {
                tableHead.innerHTML = `<th class="house-fixed-col text-start ps-3 align-middle text-dark">HOUSE \\ EVENT</th>`;
                tableBody.innerHTML = `<tr><td colspan="2" class="text-center py-4 text-muted">No events registered under ${activeCat}.</td></tr>`;
                return;
            }

            if (container) container.scrollLeft = 0;

            tableHead.innerHTML = `
                <th class="house-fixed-col text-start ps-3 align-middle text-dark">HOUSE \\ EVENT</th>
                ${filteredEvents.map(event => {
                    const res = results.find(r => r.eventId === event.id);
                    const isDone = Boolean(res && (res.results || []).length > 0);
                    return `
                        <th class="event-header-cell">
                            <div class="event-vertical-container">
                                <span style="font-size: 0.65rem;" title="${event.category}">
                                    <i class="fas ${getCategoryIcon(event.category)}"></i>
                                </span>
                                <span class="event-vertical-title" title="${event.name}">${event.name}</span>
                                <span class="badge ${isDone ? 'bg-success' : 'bg-light text-secondary border'}" style="font-size: 0.5rem; padding: 1px 2px;">
                                    ${isDone ? 'DONE' : 'WAIT'}
                                </span>
                            </div>
                        </th>
                    `;
                }).join('')}
            `;

            tableBody.innerHTML = houses.map((house, hIdx) => {
                const houseColor = house.color || '#2563eb';
                const rowBg = hIdx % 2 === 0 ? '#ffffff' : '#f8fafc';

                return `
                    <tr class="house-row-accent" style="background-color: ${rowBg};">
                        <td class="house-fixed-col text-start ps-3" style="border-left: 6px solid ${houseColor} !important;">
                            <div class="d-flex align-items-center gap-2">
                                <span class="rounded-circle shadow-sm" style="width: 10px; height: 10px; background-color: ${houseColor}; display: inline-block;"></span>
                                <span class="fw-bold text-dark text-truncate" style="font-size: 0.82rem;">${house.name}</span>
                            </div>
                        </td>

                        ${filteredEvents.map(event => {
                            const res = results.find(r => r.eventId === event.id);
                            if (!res || !res.results?.length) {
                                return `<td class="event-data-cell text-muted" style="opacity: 0.25; font-size: 0.75rem;">-</td>`;
                            }

                            const houseStandings = (res.results || []).filter(st => {
                                const hId = resolveStandingHouseId(st, event.id);
                                return hId === house.id;
                            });

                            if (!houseStandings.length) {
                                return `<td class="event-data-cell text-muted" style="font-size: 0.75rem; opacity: 0.3;">-</td>`;
                            }

                            const badgesHtml = houseStandings
                                .sort((a, b) => a.position - b.position)
                                .map(st => {
                                    const p = st.position;
                                    const badgeColor = p === 1 ? 'bg-warning text-dark' : (p === 2 ? 'bg-secondary text-white' : (p === 3 ? 'bg-light text-dark border border-secondary' : 'bg-light text-muted border'));
                                    const label = p === 1 ? '1st' : (p === 2 ? '2nd' : (p === 3 ? '3rd' : '4th'));
                                    return `
                                        <span class="pos-badge ${badgeColor} shadow-sm">
                                            ${label}
                                        </span>
                                    `;
                                }).join('');

                            return `
                                <td class="event-data-cell">
                                    <div class="event-badge-flex-row">
                                        ${badgesHtml}
                                    </div>
                                </td>
                            `;
                        }).join('')}
                    </tr>
                `;
            }).join('');

            startContinuousScroll();
        }

        setInterval(() => {
            if (!isShowingPopup) cycleSpotlight();
        }, 5000);

        setInterval(() => {
            if (!isShowingPopup) {
                categoryTimerSeconds--;
                const timerEl = document.getElementById('category-timer');
                if (timerEl) timerEl.textContent = categoryTimerSeconds;

                if (categoryTimerSeconds <= 0) {
                    categoryTimerSeconds = 20;
                    categoryIndex++;
                    renderCategoryMatrix();
                }
            }
        }, 1000);

        const matrixContainer = document.getElementById('matrix-container');
        if (matrixContainer) {
            matrixContainer.addEventListener('mouseenter', () => { isScrollPaused = true; });
            matrixContainer.addEventListener('mouseleave', () => { isScrollPaused = false; });
        }

        window.addEventListener('resize', () => {
            renderHouseLeaderboard();
            renderCategoryMatrix();
        });

        window.addEventListener('DOMContentLoaded', async () => {
            await activateScreenKeeper();
            await setupYearSelector();
            bindRealtimeListeners();
        });
    </script>
</body>
</html>
