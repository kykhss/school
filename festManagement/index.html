<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fest Management Suite</title>
    
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --sidebar-width: 250px;
            --sidebar-bg: #0f172a;       /* Slate 900 */
            --sidebar-hover: #1e293b;    /* Slate 800 */
            --sidebar-active: #312e81;   /* Indigo 900 */
            --sidebar-text: #94a3b8;     /* Slate 400 */
            --sidebar-text-active: #ffffff;
            
            --brand-primary: #4f46e5;    /* Indigo 600 */
            --brand-primary-rgb: 79, 70, 229;
            --brand-hover: #4338ca;
            
            --body-bg: #f8fafc;          /* Slate 50 */
            --card-bg: #ffffff;
            --border-color: #e2e8f0;     /* Slate 200 */
            --text-main: #0f172a;        /* Slate 900 */
            --text-muted: #64748b;       /* Slate 500 */
        }

        body {
            font-family: var(--font-family);
            background-color: var(--body-bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            margin: 0;
            overflow-x: hidden;
            font-size: 0.875rem;
            -webkit-font-smoothing: antialiased;
        }

        /* --- SIDEBAR BASE STYLING --- */
        #app-sidebar {
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            color: var(--sidebar-text);
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 1040;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Sidebar Collapsed State (Desktop) */
        #app-sidebar.collapsed {
            transform: translateX(-100%);
        }

        .sidebar-brand {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.25rem;
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            text-decoration: none;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0.85rem 0.65rem;
            margin: 0;
            flex-grow: 1;
            overflow-y: auto;
        }

        .sidebar-menu .nav-item {
            margin-bottom: 0.2rem;
        }

        .sidebar-menu .nav-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.55rem 0.85rem;
            color: var(--sidebar-text);
            font-size: 0.82rem;
            font-weight: 500;
            border-radius: 0.45rem;
            transition: all 0.15s ease;
            text-decoration: none;
            cursor: pointer;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }

        .sidebar-menu .nav-link i {
            width: 18px;
            font-size: 0.95rem;
            text-align: center;
            color: #94a3b8;
            transition: color 0.15s ease;
        }

        .sidebar-menu .nav-link:hover {
            color: #ffffff;
            background-color: var(--sidebar-hover);
        }

        .sidebar-menu .nav-link:hover i {
            color: #ffffff;
        }

        .sidebar-menu .nav-link.active {
            color: var(--sidebar-text-active);
            background-color: var(--brand-primary);
            box-shadow: 0 2px 6px rgba(79, 70, 229, 0.35);
        }

        .sidebar-menu .nav-link.active i {
            color: #ffffff;
        }

        .sidebar-section-label {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #64748b;
            padding: 0.75rem 0.85rem 0.25rem 0.85rem;
            font-weight: 700;
        }

        .sidebar-footer {
            padding: 0.85rem 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.15);
        }

        /* --- MAIN WRAPPER & TOP BAR --- */
        #content-wrapper {
            margin-left: var(--sidebar-width);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: calc(100% - var(--sidebar-width));
            transition: margin-left 0.28s cubic-bezier(0.4, 0, 0.2, 1), width 0.28s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Main Wrapper Expanded when Sidebar is Hidden */
        #content-wrapper.sidebar-collapsed {
            margin-left: 0;
            width: 100%;
        }

        #top-header {
            height: 64px;
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1020;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
        }

        #main-content {
            padding: 1.5rem;
            flex: 1;
        }

        .btn-sidebar-toggle {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.45rem;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-sidebar-toggle:hover {
            background-color: #f1f5f9;
            color: var(--brand-primary);
        }

        /* --- UI COMPONENTS --- */
        .ui-card {
            background: var(--card-bg);
            border-radius: 0.65rem;
            border: 1px solid var(--border-color);
            padding: 1.25rem;
            margin-bottom: 1.25rem;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
        }

        .ui-card-stat {
            display: flex;
            align-items: center;
            padding: 1rem 1.25rem;
            background: #ffffff;
            border-radius: 0.65rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .ui-card-stat:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
        }

        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            margin-right: 1rem;
            flex-shrink: 0;
        }

        .stat-number {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.2;
            letter-spacing: -0.02em;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.78rem;
            font-weight: 500;
        }

        .section-header {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-main);
            letter-spacing: -0.01em;
        }

        .btn-primary {
            background-color: var(--brand-primary);
            border-color: var(--brand-primary);
        }
        .btn-primary:hover, .btn-primary:focus {
            background-color: var(--brand-hover);
            border-color: var(--brand-hover);
        }

        .table thead th {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #475569;
            font-weight: 600;
            border-bottom: 1px solid #cbd5e1;
        }

        .color-dot-display {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }

        .toast-container {
            position: fixed;
            top: 1.25rem;
            right: 1.25rem;
            z-index: 1090;
        }

        /* --- MOBILE LAYOUT --- */
        @media (max-width: 991.98px) {
            #app-sidebar {
                transform: translateX(-100%);
            }
            #app-sidebar.show {
                transform: translateX(0);
                box-shadow: 4px 0 20px rgba(0, 0, 0, 0.4);
            }
            #content-wrapper {
                margin-left: 0;
                width: 100%;
            }
            .sidebar-overlay {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(15, 23, 42, 0.6);
                z-index: 1030;
                display: none;
            }
            .sidebar-overlay.show {
                display: block;
            }
        }
    </style>
</head>

    <!-- 3rd Party Core Libraries -->

    <!-- Global Helpers & System Bootstrapper -->
    <script>
        function ensureToastPlacement() {
            let placement = document.getElementById('toast-placement');
            if (!placement) {
                placement = document.createElement('div');
                placement.id = 'toast-placement';
                placement.className = 'toast-container';
                document.body.appendChild(placement);
            }
            return placement;
        }

        function ensureGlobalModal() {
            let modal = document.getElementById('global-modal');
            if (!modal) {
                document.body.insertAdjacentHTML('beforeend', `
                    <div class="modal fade" id="global-modal" tabindex="-1" aria-hidden="true">
                        <div class="modal-dialog modal-dialog-centered modal-lg">
                            <div class="modal-content shadow-lg border-0" style="border-radius: 0.75rem;">
                                <div class="modal-header py-3 bg-light border-bottom"><h6 class="modal-title fw-bold text-dark mb-0" id="globalModalLabel">System Prompt</h6><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
                                <div class="modal-body p-3" id="global-modal-body"></div>
                                <div class="modal-footer py-2 bg-light border-top" id="global-modal-footer"></div>
                            </div>
                        </div>
                    </div>
                `);
                modal = document.getElementById('global-modal');
            }
            return modal;
        }

        window.showAlert = function(message, type = 'info') {
            const toastId = 'toast-' + Date.now();
            const bgClass = type === 'danger' ? 'bg-danger text-white' : 
                            type === 'success' ? 'bg-success text-white' : 
                            type === 'warning' ? 'bg-warning text-dark' : 'bg-primary text-white';

            const toastHtml = `
                <div id="${toastId}" class="toast align-items-center ${bgClass} border-0 shadow-sm" role="alert" aria-live="assertive" aria-atomic="true" style="border-radius: 0.5rem;">
                    <div class="d-flex">
                        <div class="toast-body small py-2 px-3">${message}</div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                </div>
            `;
            ensureToastPlacement().insertAdjacentHTML('beforeend', toastHtml);
            const toastElement = document.getElementById(toastId);
            const toast = new bootstrap.Toast(toastElement, { delay: 3500 });
            toast.show();
            toastElement.addEventListener('hidden.bs.toast', () => toastElement.remove());
        };

        window.showGlobalModal = function(title, bodyHtml, footerHtml = null) {
            const modalElement = ensureGlobalModal();
            document.getElementById('globalModalLabel').textContent = title;
            document.getElementById('global-modal-body').innerHTML = bodyHtml;
            const footer = document.getElementById('global-modal-footer');
            if (footerHtml !== null) {
                footer.innerHTML = footerHtml;
                footer.classList.remove('d-none');
            } else {
                footer.classList.add('d-none');
            }
            const modalInstance = new bootstrap.Modal(modalElement);
            modalInstance.show();
            return modalInstance;
        };

        window.printReport = function({ contentHtml, title, extraCss = '', pageSize = 'A4 portrait', onLoadCallback = null }) {
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>${title}</title>
                    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
                    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script>
                    <style>
                        @page { size: ${pageSize}; margin: 10mm; }
                        body { font-family: 'Inter', sans-serif; background: #fff; color: #000; padding: 10px; font-size: 12px; }
                        @media print { .no-print { display: none !important; } }
                        ${extraCss}
                    </style>
                </head>
                <body>
                    ${contentHtml}
                </body>
                </html>
            `);
            printWindow.document.close();
            printWindow.focus();

            setTimeout(() => {
                if (typeof onLoadCallback === 'function') {
                    onLoadCallback(printWindow);
                }
                setTimeout(() => {
                    printWindow.print();
                    printWindow.close();
                }, 750);
            }, 500);
        };

        // Sidebar Navigation & Toggle Controller
        document.addEventListener('DOMContentLoaded', () => {
            const sidebar = document.getElementById('app-sidebar');
            const contentWrapper = document.getElementById('content-wrapper');
            const backdrop = document.getElementById('sidebar-backdrop');
            const toggleBtn = document.getElementById('toggle-sidebar-btn');
            const collapseBtn = document.getElementById('collapse-sidebar-btn');

            const isMobile = () => window.innerWidth < 992;
            const savedState = localStorage.getItem('sidebar_collapsed');

            // Apply saved state on desktop load
            if (!isMobile() && savedState === 'true') {
                sidebar.classList.add('collapsed');
                contentWrapper.classList.add('sidebar-collapsed');
            }

            function toggleSidebar() {
                if (isMobile()) {
                    sidebar.classList.toggle('show');
                    backdrop.classList.toggle('show');
                } else {
                    const isCurrentlyCollapsed = sidebar.classList.contains('collapsed');
                    if (isCurrentlyCollapsed) {
                        sidebar.classList.remove('collapsed');
                        contentWrapper.classList.remove('sidebar-collapsed');
                        localStorage.setItem('sidebar_collapsed', 'false');
                    } else {
                        sidebar.classList.add('collapsed');
                        contentWrapper.classList.add('sidebar-collapsed');
                        localStorage.setItem('sidebar_collapsed', 'true');
                    }
                }
            }

            function closeSidebar() {
                if (isMobile()) {
                    sidebar.classList.remove('show');
                    backdrop.classList.remove('show');
                } else {
                    sidebar.classList.add('collapsed');
                    contentWrapper.classList.add('sidebar-collapsed');
                    localStorage.setItem('sidebar_collapsed', 'true');
                }
            }

            toggleBtn?.addEventListener('click', toggleSidebar);
            collapseBtn?.addEventListener('click', closeSidebar);
            backdrop?.addEventListener('click', closeSidebar);
        });
    </script>

    <!-- App Module Bootstrap -->
    <script type="module">
        import { initializeAppState, switchAcademicYear, state } from './app-state.js';
        import { initRouter, handleHashRoute } from './fest-router.js';

        async function init() {
            initRouter();

            const hash = window.location.hash || '';
            if (hash.startsWith('#fest-judge') || hash.startsWith('#fest-entry') || hash.startsWith('#fest-scan') || hash.startsWith('#j/')) {
                await handleHashRoute();
                return;
            }

            const adminHandler = await window.waitForRouteHandler('checkForAdminMode');
            if (adminHandler) {
                const handled = await adminHandler();
                if (handled) return;
            }

            await initializeAppState();

            const yearSelector = document.getElementById('global-academic-year-select');
            if (yearSelector) {
                if (state.academicYears && state.academicYears.length > 0) {
                    yearSelector.innerHTML = state.academicYears.map(year => 
                        `<option value="${year.id}" ${year.id === state.activeYear?.id ? 'selected' : ''}>${year.label || year.id}</option>`
                    ).join('');
                } else {
                    yearSelector.innerHTML = '<option value="">No Academic Year</option>';
                }

                yearSelector.addEventListener('change', async (e) => {
                    if (e.target.value) {
                        await switchAcademicYear(e.target.value);
                        if (typeof window.renderFestManagement === 'function') {
                            window.renderFestManagement();
                        }
                    }
                });
            }

            if (typeof window.renderFestManagement === 'function') {
                window.renderFestManagement();
            }
        }
        
        window.addEventListener('DOMContentLoaded', init);
    </script>
